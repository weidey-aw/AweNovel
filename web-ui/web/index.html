<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AweNovel：Galgame 游戏库、攻略评测、资源分享与 AI 看板娘" />
    <title>AweNovel</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f2f7ff;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #0e0e16;
      }
    </style>
    <script>
      // 首帧前应用主题，避免暗色用户看到白屏闪烁
      ;(function () {
        try {
          var t = localStorage.getItem('gal-theme')
          if (t !== 'dark') t = 'light'
          var d = document.documentElement
          d.dataset.theme = t
          if (t === 'dark') d.classList.add('dark')
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
