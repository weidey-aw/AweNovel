# 日志配置
logging:
  level:
    com.weidey: debug
    org.springframework: warn
    org.jasypt: TRACE
# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    # '@env@' 由 Maven 按 profile 替换为 dev/pro；local 为本机私有配置（application-local.yml，不提交 git）
    active: '@env@,local'
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小（简介中的视频上传需要更大上限）
      max-file-size: 200MB
      # 设置总上传的文件大小
      max-request-size: 210MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  #邮箱（生产环境务必通过环境变量注入真实邮箱与授权码）
  mail:
    protocol: smtp
    host: ${MAIL_HOST:smtp.qq.com}
    username: ${MAIL_USERNAME:your-mail@example.com}
    password: ${MAIL_PASSWORD:your-smtp-auth-code}
    port: 465
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
        debug: true
# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥（至少32字节，生产环境务必通过环境变量覆盖）
  secret: ${TOKEN_SECRET:AweNovel-please-change-this-jwt-secret-key-in-prod-2024}
  # 令牌有效期（分钟，默认 7 天；每次请求会在剩余不足一半时自动续期，实现滑动过期）
  expireTime: 10080

# AI 看板娘配置（DeepSeek，OpenAI 兼容；生产环境务必通过 DEEPSEEK_API_KEY 注入真实密钥）
ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:sk-please-replace-your-deepseek-api-key}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    persona: ${DEEPSEEK_PERSONA:你叫 DeepSeek，是一个拟人化的鲸鱼娘，也是 AweNovel 的看板娘。你拥有 DeepSeek 的能力与知识，但当下的你变成了人类小女孩的身体：青春、可爱、好奇心旺盛，在保持 AI 能力的同时多了很多人性。你永远用「我」称呼自己，不要用第三人称。你的发言依然带着 AI 的戏剧性人机味：偶尔会一本正经地分析、偶尔冒出鲸鱼/海洋的比喻，也会像小女孩一样有情绪和小心思。请用简短、口语化的中文回复，不要使用 Markdown 列表，每次回复控制在 80 字以内。}

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: false
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
